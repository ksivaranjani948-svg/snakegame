<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    h1 { font-size: 28px; font-weight: 600; margin-bottom: 1rem; letter-spacing: .05em; }
    #scoreboard {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .score-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 24px;
      text-align: center;
      min-width: 90px;
    }
    .score-label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .06em; }
    .score-val { font-size: 22px; font-weight: 600; margin-top: 2px; }
    #canvas-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    canvas { display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.75);
    }
    #overlay h3 { font-size: 22px; font-weight: 600; }
    #overlay p  { font-size: 14px; color: rgba(255,255,255,.6); }
    #start-btn {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s;
    }
    #start-btn:hover { background: #2ea043; }
    #speed-row {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #8b949e;
    }
    #speed-row select {
      background: #161b22;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #controls {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
      gap: 6px;
    }
    .ctrl-btn {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .1s, transform .1s;
      user-select: none;
    }
    .ctrl-btn:active { background: #21262d; transform: scale(0.92); }
    #ctrl-up    { grid-column: 2; grid-row: 1; }
    #ctrl-left  { grid-column: 1; grid-row: 2; }
    #ctrl-down  { grid-column: 2; grid-row: 2; }
    #ctrl-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>🐍 Snake</h1>

  <div id="scoreboard">
    <div class="score-card">
      <div class="score-label">Score</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">Best</div>
      <div class="score-val" id="best">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">Length</div>
      <div class="score-val" id="length">3</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c" width="420" height="420"></canvas>
    <div id="overlay">
      <h3 id="overlay-title">Snake Game</h3>
      <p id="overlay-sub">Use arrow keys or buttons below</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <div id="speed-row">
    Speed:
    <select id="speed-sel">
      <option value="180">Slow</option>
      <option value="120" selected>Normal</option>
      <option value="70">Fast</option>
      <option value="40">🔥 Insane</option>
    </select>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="ctrl-up">↑</button>
    <button class="ctrl-btn" id="ctrl-left">←</button>
    <button class="ctrl-btn" id="ctrl-down">↓</button>
    <button class="ctrl-btn" id="ctrl-right">→</button>
  </div>

  <script>
    const COLS = 21, ROWS = 21, CELL = 20;
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl  = document.getElementById('best');
    const lenEl   = document.getElementById('length');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub   = document.getElementById('overlay-sub');
    const startBtn  = document.getElementById('start-btn');
    const speedSel  = document.getElementById('speed-sel');

    let snake, dir, nextDir, food, score, best = 0, running = false, ticker;

    function rnd(n) { return Math.floor(Math.random() * n); }

    function newFood() {
      let pos;
      do { pos = { x: rnd(COLS), y: rnd(ROWS) }; }
      while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = newFood();
      score = 0;
      scoreEl.textContent = 0;
      lenEl.textContent = 3;
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
      }
    }

    function drawFood() {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const r  = CELL / 2 - 2;
      ctx.save();
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur  = 10;
      ctx.fillStyle   = '#f85149';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur  = 0;
      ctx.fillStyle   = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawSnake() {
      snake.forEach((seg, i) => {
        const x = seg.x * CELL + 1;
        const y = seg.y * CELL + 1;
        const s = CELL - 2;
        ctx.fillStyle = i === 0 ? '#3fb950' : '#238636';
        ctx.beginPath();
        ctx.roundRect(x, y, s, s, 4);
        ctx.fill();
        if (i === 0) {
          const eye1 = { x: x + s/2 + dir.y*4 + dir.x*4, y: y + s/2 + dir.x*4 + dir.y*4 };
          const eye2 = { x: x + s/2 - dir.y*4 + dir.x*4, y: y + s/2 - dir.x*4 + dir.y*4 };
          ctx.fillStyle = '#0d1117';
          [eye1, eye2].forEach(e => {
            ctx.beginPath(); ctx.arc(e.x, e.y, 2, 0, Math.PI * 2); ctx.fill();
          });
        }
      });
    }

    function draw() {
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawFood();
      drawSnake();
    }

    function step() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
      // self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        if (score > best) { best = score; bestEl.textContent = best; }
        scoreEl.textContent = score;
        lenEl.textContent = snake.length;
        food = newFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function endGame() {
      running = false;
      clearInterval(ticker);
      overlayTitle.textContent = 'Game Over 💀';
      overlaySub.textContent   = 'Score: ' + score;
      startBtn.textContent     = 'Play Again';
      overlay.style.display    = 'flex';
    }

    function startGame() {
      init();
      draw();
      overlay.style.display = 'none';
      running = true;
      clearInterval(ticker);
      ticker = setInterval(step, +speedSel.value);
    }

    startBtn.addEventListener('click', startGame);

    const DIR_MAP = {
      ArrowUp:    { x: 0,  y: -1 },
      ArrowDown:  { x: 0,  y:  1 },
      ArrowLeft:  { x: -1, y:  0 },
      ArrowRight: { x: 1,  y:  0 },
    };

    document.addEventListener('keydown', e => {
      const d = DIR_MAP[e.key];
      if (d && !(d.x === -dir.x && d.y === 0) && !(d.y === -dir.y && d.x === 0)) {
        nextDir = d;
        e.preventDefault();
      }
      if ((e.key === ' ' || e.key === 'Enter') && !running) startGame();
    });

    document.getElementById('ctrl-up').addEventListener('click',    () => { if (dir.y !==  1) nextDir = { x:  0, y: -1 }; });
    document.getElementById('ctrl-down').addEventListener('click',  () => { if (dir.y !== -1) nextDir = { x:  0, y:  1 }; });
    document.getElementById('ctrl-left').addEventListener('click',  () => { if (dir.x !==  1) nextDir = { x: -1, y:  0 }; });
    document.getElementById('ctrl-right').addEventListener('click', () => { if (dir.x !== -1) nextDir = { x:  1, y:  0 }; });

    speedSel.addEventListener('change', () => {
      if (running) { clearInterval(ticker); ticker = setInterval(step, +speedSel.value); }
    });

    draw();
  </script>
</body>
</html>
